[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dch-e2e"
version = "0.1.0"
description = "End-to-end tests for Data Connect Hub"
requires-python = ">=3.11"
dependencies = [
    "data-connect-hub[flight]",
    "pytest>=8.0",
    "httpx>=0.27,<1",
    "grpcio>=1.66",
    "grpcio-health-checking>=1.66",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "query: tests that execute SQL queries via Flight (require DCH_TEST_PG_URL)",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
