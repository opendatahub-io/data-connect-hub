name: Neo4j
provider: neo4j
description: Neo4j graph database
credentials_fields:
  - name: URI
    label: URI
    description: Neo4j connection URI (e.g. bolt://host:7687 or neo4j://host:7687)
    required: true
    type: string
  - name: USERNAME
    label: Username
    description: Neo4j username
    required: false
    type: string
    default_value: neo4j
  - name: PASSWORD
    label: Password
    description: Neo4j password
    required: true
    type: string
  - name: DATABASE
    label: Database
    description: Neo4j database name
    required: false
    type: string
    default_value: neo4j
  - name: CA_CERT
    label: CA Certificate
    description: CA certificate for TLS verification
    required: false
    type: string
