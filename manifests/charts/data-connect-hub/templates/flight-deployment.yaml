{{- with .Values.flightService }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dch.prefix" $ }}-{{ .name }}
  labels:
    app.kubernetes.io/name: {{ .name }}
    {{- include "dch.labels" $ | nindent 4 }}
spec:
  replicas: {{ .replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .name }}
        {{- include "dch.labels" $ | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: 30
      serviceAccountName: {{ include "dch.prefix" $ }}-{{ .name }}-sa
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: flight-server
          image: {{ required "images.flightService is required" $.Values.images.flightService | quote }}
          imagePullPolicy: {{ .imagePullPolicy | default "IfNotPresent" }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .resources | nindent 12 }}
          args:
            - --config
            - /config/config.toml
          ports:
            - name: grpc
              containerPort: 8443
            - name: metrics
              containerPort: 9090
          env:
            {{- if $.Values.trace.endpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ $.Values.trace.endpoint | quote }}
            {{- end }}
            {{- if $.Values.trace.insecure }}
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: {{ $.Values.trace.insecure | quote }}
            {{- end }}
            {{- if $.Values.trace.certificate }}
            - name: OTEL_EXPORTER_OTLP_CERTIFICATE
              value: {{ $.Values.trace.certificate | quote }}
            {{- end }}
            {{- with .env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /config
            - name: db-secret
              mountPath: /secrets
              readOnly: true
            - name: tls
              mountPath: /etc/tls/private
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- with .volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "3"]
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 5
            periodSeconds: 15
      volumes:
        - name: config
          configMap:
            name: {{ include "dch.prefix" $ }}-{{ .name }}-config
        - name: db-secret
          secret:
            secretName: dch-database-config
        - name: tls
          secret:
            secretName: {{ include "dch.prefix" $ }}-{{ .name }}-tls
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 10Mi
        {{- with .volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
