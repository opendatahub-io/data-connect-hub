apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "dch.prefix" . }}-read
  labels:
    {{- include "dch.labels" . | nindent 4 }}
rules:
  - apiGroups: ["dataconnecthub.opendatahub.io"]
    resources: ["data-connections", "data-connection-types", "data-store"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "dch.prefix" . }}-read-write
  labels:
    {{- include "dch.labels" . | nindent 4 }}
rules:
  - apiGroups: ["dataconnecthub.opendatahub.io"]
    resources: ["data-connections", "data-connection-types", "data-store"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "post", "put"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "dch.prefix" . }}-admin
  labels:
    {{- include "dch.labels" . | nindent 4 }}
rules:
  - apiGroups: ["dataconnecthub.opendatahub.io"]
    resources: ["data-connections", "data-connection-types", "data-store"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "post", "put"]
