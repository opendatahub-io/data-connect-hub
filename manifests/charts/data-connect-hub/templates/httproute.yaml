{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.httpRouteName | default (printf "%s-route" .Release.Name) }}
  labels:
    {{- include "dch.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.parentRef.name }}
      namespace: {{ .Values.gateway.parentRef.namespace }}
  rules:
    - matches:
        - path:
            type: Exact
            value: /health
        - path:
            type: PathPrefix
            value: /api/v1alpha1/data/connections
        - path:
            type: PathPrefix
            value: /api/v1alpha1/data/connection-types
        - path:
            type: PathPrefix
            value: /api/v1alpha1/data/test
      backendRefs:
        - name: {{ include "dch.restName" . }}
          port: 8443
    {{- with .Values.flightService }}
    - matches:
        - path:
            type: PathPrefix
            value: /grpc.health.v1.Health
        - path:
            type: PathPrefix
            value: /arrow.flight.protocol.FlightService
      backendRefs:
        - name: {{ include "dch.prefix" $ }}-{{ .name }}
          port: 8443
    {{- end }}
{{- end }}
