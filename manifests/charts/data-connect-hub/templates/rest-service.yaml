apiVersion: v1
kind: Service
metadata:
  name: {{ include "dch.restName" . }}
  labels:
    app.kubernetes.io/name: rest-service
    {{- include "dch.labels" . | nindent 4 }}
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: {{ include "dch.restName" . }}-tls
spec:
  type: ClusterIP
  ports:
    - name: https
      port: 8443
      targetPort: https
    - name: metrics
      port: 9090
      targetPort: metrics
  selector:
    app.kubernetes.io/name: rest-service
