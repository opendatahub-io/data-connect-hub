apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dch.restName" . }}
  labels:
    app.kubernetes.io/name: rest-service
    {{- include "dch.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.restService.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: rest-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rest-service
        {{- include "dch.labels" . | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: 30
      serviceAccountName: {{ include "dch.restSA" . }}
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kube-rbac-proxy
          image: {{ required "images.kubeRbacProxy is required" .Values.images.kubeRbacProxy | quote }}
          args:
            - --secure-listen-address=0.0.0.0:8443
            - --upstream=http://127.0.0.1:8080
            - --config-file=/etc/kube-rbac-proxy/config-file.yaml
            - --ignore-paths=/health
            - --tls-cert-file=/etc/tls/private/tls.crt
            - --tls-private-key-file=/etc/tls/private/tls.key
            # x-remote-user gives the service a username for authentications
            # that carry no forwardable token. The proxy also injects
            # x-remote-groups as a delimiter-joined string; the service never
            # parses it because group names may contain the separator, so no
            # separator is configured here.
            - --auth-header-fields-enabled
            - --logtostderr=true
            {{- if .Values.kubeRbacProxy.tokenReviewAudiences }}
            - {{ printf "--auth-token-audiences=%s" (join "," .Values.kubeRbacProxy.tokenReviewAudiences) | quote }}
            {{- end }}
          ports:
            - name: https
              containerPort: 8443
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.kubeRbacProxy.resources | nindent 12 }}
          volumeMounts:
            - name: kube-rbac-proxy-config
              mountPath: /etc/kube-rbac-proxy
            - name: proxy-tls
              mountPath: /etc/tls/private
              readOnly: true
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "3"]
          readinessProbe:
            httpGet:
              path: /health
              port: https
              scheme: HTTPS
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: https
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 15
        - name: rest-server
          image: {{ required "images.restService is required" .Values.images.restService | quote }}
          imagePullPolicy: {{ .Values.restService.imagePullPolicy | default "IfNotPresent" }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.restService.resources | nindent 12 }}
          args:
            - --config
            - /config/config.toml
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          env:
            {{- if .Values.trace.endpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.trace.endpoint | quote }}
            {{- end }}
            {{- if .Values.trace.insecure }}
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: {{ .Values.trace.insecure | quote }}
            {{- end }}
            {{- if .Values.trace.certificate }}
            - name: OTEL_EXPORTER_OTLP_CERTIFICATE
              value: {{ .Values.trace.certificate | quote }}
            {{- end }}
            {{- with .Values.restService.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.restService.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /config
            - name: db-secret
              mountPath: /secrets
              readOnly: true
            - name: flight-ca
              mountPath: /etc/tls/flight
              readOnly: true
            {{- with .Values.restService.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "3"]
          readinessProbe:
            httpGet:
              path: /health
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 15
      volumes:
        - name: config
          configMap:
            name: {{ include "dch.restName" . }}-config
        - name: kube-rbac-proxy-config
          configMap:
            name: {{ include "dch.restName" . }}-kube-rbac-proxy-config
        - name: proxy-tls
          secret:
            secretName: {{ include "dch.restName" . }}-tls
        - name: db-secret
          secret:
            secretName: dch-database-config
        - name: flight-ca
          configMap:
            name: {{ include "dch.prefix" . }}-flight-service-ca
            items:
              - key: service-ca.crt
                path: ca.crt
        {{- with .Values.restService.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
