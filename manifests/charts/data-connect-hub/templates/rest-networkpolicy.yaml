apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dch.restName" . }}
  labels:
    app.kubernetes.io/name: rest-service
    {{- include "dch.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rest-service
  policyTypes:
    - Ingress
  # Allow ingress only through the TLS proxy and metrics endpoint. The REST
  # server's plaintext port is loopback-only and is not exposed to the pod network.
  ingress:
    # The gateway routes external traffic to the REST service.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.gateway.parentRef.namespace }}
          podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: {{ .Values.gateway.parentRef.name }}
      ports:
        - protocol: TCP
          port: 8443
    # The controller calls REST to register Flight services and connection types.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.controllerNamespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: dc-controller
              control-plane: manager
      ports:
        - protocol: TCP
          port: 8443
    # Metrics scrape.
    - ports:
        - protocol: TCP
          port: 9090
