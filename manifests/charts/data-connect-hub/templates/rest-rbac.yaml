apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "dch.prefix" . }}-rest-service-data-access
  labels:
    {{- include "dch.labels" . | nindent 4 }}
rules:
  - apiGroups: ["dataconnecthub.opendatahub.io"]
    resources: ["data-connections", "data-connection-types", "data-store"]
    verbs: ["get", "list", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "dch.prefix" . }}-rest-service-data-access
  labels:
    {{- include "dch.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "dch.restSA" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "dch.prefix" . }}-rest-service-data-access
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "dch.prefix" . }}-rest-service-secret-access
  labels:
    {{- include "dch.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "dch.prefix" . }}-secret-export
  labels:
    {{- include "dch.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
