apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dch.restName" . }}-config
  labels:
    app.kubernetes.io/name: rest-service
    {{- include "dch.labels" . | nindent 4 }}
data:
  config.toml: |
    [server]
    address = "0.0.0.0"
    port = 8080
    sa-token-file = "/var/run/secrets/kubernetes.io/serviceaccount/token"

    [global-connection-types]
    tenant-id = "{{ .Release.Namespace }}"

    [metrics]
    enabled = true
    address = "0.0.0.0"
    port = 9090

    [flight-service]
    {{- if .Values.flightService }}
    address = "{{ include "dch.prefix" . }}-{{ .Values.flightService.name }}.{{ .Release.Namespace }}.svc"
    {{- else }}
    address = "flight-service"
    {{- end }}
    ca-cert = "/etc/tls/flight/ca.crt"
    {{- if .Values.restService.config.tokenReviewAudiences }}

    [auth]
    token_review_audiences = {{ .Values.restService.config.tokenReviewAudiences | toJson }}
    {{- end }}
