[workspace]
members = [
    "libs/commons",
    "libs/kube-utils",
    "libs/pg-meta-store",
    "connectors/postgres",
    "connectors/sqlite",
    "services/flight",
    "services/rest",
]
resolver = "2"

[workspace.package]
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.dependencies]
commons = { path = "libs/commons" }
postgres-connector = { path = "connectors/postgres" }
sqlite-connector = { path = "connectors/sqlite" }
kube-utils = { path = "libs/kube-utils" }
pg-meta-store = { path = "libs/pg-meta-store" }
arrow = "59.1.0"
arrow-flight = { version = "59.1.0", features = ["flight-sql"] }
tonic = "0.14"
tonic-health = "0.14"
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "signal"] }
tokio-stream = "0.1"
futures = "0.3"
prost = "0.14"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
test-log = { version = "0.2", features = ["trace"] }
actix-web = "4.14.0"
actix-cors = "0.6"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
clap = { version = "4.6", features = ["derive"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "sqlite"] }
async-trait = "0.1"
async-stream = "0.3"
bytes = "1.0"
config = "0.15"
kube = { version = "3.1.0", features = ["client", "runtime"] }
k8s-openapi = { version = "0.27.0", features = ["latest"] }
moka = "0.12"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"