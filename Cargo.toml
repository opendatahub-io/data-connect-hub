[workspace]
members = [
    "libs/commons",
    "libs/kube-utils",
    "libs/pg-meta-store",
    "connectors/postgres",
    "connectors/sqlite",
    "connectors/s3",
    "connectors/milvus",
    "connectors/elasticsearch",
    "services/flight",
    "services/rest",
]
resolver = "2"

[workspace.package]
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.dependencies]
commons = { path = "libs/commons" }
postgres-connector = { path = "connectors/postgres" }
sqlite-connector = { path = "connectors/sqlite" }
s3-connector = { path = "connectors/s3" }
milvus-connector = { path = "connectors/milvus" }
elasticsearch-connector = { path = "connectors/elasticsearch" }
milvus-sdk-rust = "2.6"
kube-utils = { path = "libs/kube-utils" }
pg-meta-store = { path = "libs/pg-meta-store" }
arrow = "59.1.0"
arrow-flight = { version = "59.1.0", features = ["flight-sql"] }
tonic = "0.14"
tonic-health = "0.14"
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "signal"] }
tokio-stream = "0.1"
futures = "0.3"
prost = "0.14"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
json-patch = "4"
actix-web = "4.14.0"
actix-cors = "0.6"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
clap = { version = "4.6", features = ["derive"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "sqlite", "chrono", "uuid", "json", "bigdecimal"] }
bigdecimal = "0.4"
async-trait = "0.1"
async-stream = "0.3"
bytes = "1.0"
config = "0.15"
kube = { version = "3.1.0", features = ["client", "runtime"] }
k8s-openapi = { version = "0.27.0", features = ["latest"] }
moka = "0.12"
sha2 = "0.10"
tower = "0.5"
http = "1"
http-body = "1"
http-body-util = "0.1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
opendal = { version = "0.58", features = ["services-s3"] }
parquet = { version = "59.1", default-features = false, features = ["arrow", "async", "snap", "zstd", "lz4"] }
arrow-csv = "59.1"
arrow-json = "59.1"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
url = "2.5"
