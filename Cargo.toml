[workspace]
members = [
    "commons",
    "flight-service",
    "pg-meta-store",
    "postgres-connector",
    "rest-service",
    "sqlite-connector",
]
resolver = "2"

[workspace.package]
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.dependencies]
commons = { path = "commons" }
postgres-connector = { path = "postgres-connector" }
sqlite-connector = { path = "sqlite-connector" }
pg-meta-store = { path = "pg-meta-store" }
arrow = "59.1.0"
arrow-flight = { version = "59.1.0", features = ["flight-sql"] }
tonic = "0.14"
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "signal"] }
tokio-stream = "0.1"
futures = "0.3"
prost = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
test-log = { version = "0.2", features = ["trace"] }
actix-web = "4.14.0"
actix-cors = "0.6"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
clap = { version = "4.6", features = ["derive"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "sqlite"] }
async-trait = "0.1"
async-stream = "0.3"
bytes = "1.0"
config = "0.15"
moka = "0.12"