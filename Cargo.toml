[workspace]
members = [
    "libs/commons",
    "libs/format-readers",
    "libs/kube-utils",
    "libs/pg-meta-store",
    "connectors/postgres",
    "connectors/sqlite",
    "connectors/s3",
    "connectors/milvus",
    "connectors/elasticsearch",
    "connectors/neo4j",
    "connectors/uri",
    "services/flight",
    "services/rest",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.dependencies]
commons = { path = "libs/commons" }
postgres-connector = { path = "connectors/postgres" }
sqlite-connector = { path = "connectors/sqlite" }
s3-connector = { path = "connectors/s3" }
milvus-connector = { path = "connectors/milvus" }
elasticsearch-connector = { path = "connectors/elasticsearch" }
neo4j-connector = { path = "connectors/neo4j" }
uri-connector = { path = "connectors/uri" }
neo4rs = "0.8"
format-readers = { path = "libs/format-readers" }
kube-utils = { path = "libs/kube-utils" }
pg-meta-store = { path = "libs/pg-meta-store" }
flight-service = { path = "services/flight", default-features = false }
arrow = "60.2.0"
arrow-flight = { version = "60.2.0", features = ["flight-sql"] }
tonic = "0.14"
tonic-health = "0.14"
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "signal", "net", "io-util"] }
tokio-stream = "0.1"
# No crypto backend feature: the provider is installed at runtime (rustls-ossl),
# so rustls dispatches to the system OpenSSL rather than a statically linked
# Rust implementation. See ODH-ADR-0003.
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12"] }
rcgen = "0.13"
futures = "0.3"
prost = "0.14"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
tempfile = "3.27"
json-patch = "4"
# Default features minus "ws": the WebSocket feature is the only thing that
# pulls the optional `sha1` dependency into actix-http, and nothing here uses
# WebSockets.
actix-web = { version = "4.18.1", default-features = false, features = [
    "macros",
    "compress-brotli",
    "compress-gzip",
    "compress-zstd",
    "cookies",
    "http2",
    "unicode",
    "compat",
] }
actix-cors = "0.7"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
clap = { version = "4.6", features = ["derive"] }
# tls-native-tls, not tls-rustls: sqlx-core calls
# ClientConfig::builder_with_provider(ring) and so ignores the process-default
# provider. native-tls is OpenSSL on Linux.
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "sqlite", "chrono", "uuid", "json", "bigdecimal", "tls-native-tls"] }
bigdecimal = "0.4"
async-trait = "0.1"
async-stream = "0.3"
bytes = "1.0"
config = "0.15"
# default-features = false drops "ring". rustls-tls builds its config with
# ClientConfig::builder(), which resolves the process-default provider
# (rustls-ossl); kube only installs a provider of its own under the
# "aws-lc-rs" feature, which is off.
#
# Not openssl-tls: hyper-openssl's SSL_CTX is created in a library context
# that never loads /etc/pki/tls/openssl.cnf, so the crypto-policies group
# list does not apply and OpenSSL 3.5 falls back to offering X25519 and
# ML-KEM — none of which the frozen 3.0.7 FIPS provider can supply.
kube = { version = "4.2.0", default-features = false, features = ["client", "runtime", "rustls-tls"] }
k8s-openapi = { version = "0.28.0", features = ["latest"] }
moka = "0.12"
tower = "0.5"
http = "1"
http-body = "1"
http-body-util = "0.1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
opendal = { version = "0.58", features = ["services-s3"] }
opendal-http-transport-reqwest = { version = "0.58", default-features = false, features = ["rustls"] }
# OpenDAL 0.58's reqwest transport uses reqwest 0.13.
reqwest-opendal = { package = "reqwest", version = "0.13", default-features = false, features = ["rustls", "stream"] }
parquet = { version = "60.2", default-features = false, features = ["arrow", "async", "snap", "zstd", "lz4"] }
arrow-csv = "60.2"
arrow-json = "60.2"
arrow-cast = "60.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
mime = "0.3"
url = "2.5"
rustls = { version = "0.23", default-features = false, features = ["std", "logging", "tls12"] }
# rustls CryptoProvider backed by OpenSSL 3's provider layer, reaching the
# RHEL FIPS provider. Pinned exactly: published at 0.0.1, so semver gives no
# compatibility guarantee.
rustls-ossl = "=0.0.1"
# Used directly for the DRBG behind fips::FipsSecureRandom, and also shared
# with rustls-ossl: kept at the version rustls-ossl resolves so Cargo unifies
# the two and its copy picks up the "log" feature. That feature makes every
# failed OpenSSL call emit the OpenSSL error stack through `log::error!`,
# without which rustls flattens the cause into an opaque
# `FailedToGetRandomBytes` that names neither the call nor the reason.
ossl = { version = "1.5.4", features = ["log"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
opentelemetry = "0.32"
opentelemetry_sdk = "0.32"
opentelemetry-otlp = { version = "0.32", default-features = false, features = [
    "grpc-tonic",
    "trace",
    # tls-provider-agnostic rather than tls-aws-lc: it enables tonic's TLS
    # without selecting a crypto backend, so the exporter uses the
    # process-default provider (rustls-ossl) like everything else.
    "tls-provider-agnostic",
    "tls-roots",
    # Without this the exporter's own error logging is compiled out, so a
    # failing OTLP connection is completely silent.
    "internal-logs",
] }
tracing-opentelemetry = "0.33"
