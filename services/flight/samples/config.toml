[database]
url = "postgresql://dch_user:dch_password@localhost:5432/dch_db"

[server]
address = "127.0.0.1"
port = 50051

[ingestion_cache_pools]
max_capacity = 50
ttl_secs = 30
idle_secs = 30

[query]
batch_size = 512
max_rows = 1000000

[tls]
# cert_file = "/etc/tls/private/tls.crt"
# key_file = "/etc/tls/private/tls.key"

[auth]
enabled = false
cache_ttl_secs = 300
token_review_audiences = ["https://kubernetes.default.svc"]

[metrics]
enabled = false
address = "0.0.0.0"
port = 9090
