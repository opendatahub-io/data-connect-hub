repos:
  - repo: local
    hooks:
      - id: rustfmt-check
        name: rustfmt check
        description: Check Rust formatting with cargo fmt.
        entry: cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-check
        name: cargo check
        description: Check workspace crates for compile errors.
        entry: cargo check --workspace
        language: system
        types: [rust]
        pass_filenames: false
      - id: clippy
        name: clippy
        description: Lint Rust workspace with warnings denied.
        entry: cargo clippy --workspace --all-targets -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
