apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "dc-controller.fullname" . }}-manager-role
  labels:
    {{- include "dc-controller.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: [configmaps, serviceaccounts, services]
  verbs: [create, delete, get, list, patch, update, watch]
- apiGroups: [""]
  resources: [secrets]
  verbs: [get, list, watch, update, patch]
- apiGroups: [apps]
  resources: [deployments]
  verbs: [create, delete, get, list, patch, update, watch]
- apiGroups: [dataconnecthub.opendatahub.io]
  resources: [dataconnectservices]
  verbs: [create, delete, get, list, patch, update, watch]
- apiGroups: [dataconnecthub.opendatahub.io]
  resources: [dataconnectservices/finalizers]
  verbs: [update]
- apiGroups: [dataconnecthub.opendatahub.io]
  resources: [dataconnectservices/status]
  verbs: [get, patch, update]
- apiGroups: [dataconnecthub.opendatahub.io]
  resources: [initdataconnectiontypes]
  verbs: [create, delete, get, list, watch]
- apiGroups: [dataconnecthub.opendatahub.io]
  resources: [initdataconnectiontypes/status]
  verbs: [get, patch, update]
- apiGroups: [dataconnecthub.opendatahub.io]
  resources: [initdataconnections]
  verbs: [get, list, watch]
- apiGroups: [dataconnecthub.opendatahub.io]
  resources: [initdataconnections/status]
  verbs: [get, patch, update]
- apiGroups: [gateway.networking.k8s.io]
  resources: [gateways]
  verbs: [get, list, watch]
- apiGroups: [config.openshift.io]
  resources: [ingresses]
  verbs: [get, list, watch]
- apiGroups: [operator.openshift.io]
  resources: [ingresscontrollers]
  verbs: [get, list, watch]
- apiGroups: [gateway.networking.k8s.io]
  resources: [httproutes]
  verbs: [create, delete, get, list, patch, update, watch]
- apiGroups: [networking.k8s.io]
  resources: [networkpolicies]
  verbs: [create, delete, get, list, patch, update, watch]
- apiGroups: [rbac.authorization.k8s.io]
  resources: [clusterroles, clusterrolebindings]
  verbs: [create, delete, get, list, patch, update, watch]
- apiGroups: [authentication.k8s.io]
  resources: [tokenreviews]
  verbs: [create]
- apiGroups: [authorization.k8s.io]
  resources: [subjectaccessreviews]
  verbs: [create]
- apiGroups: [dataconnecthub.opendatahub.io]
  resources: [data-connections, data-connection-types]
  verbs: [create, delete, get, list, patch, post, put, update, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "dc-controller.fullname" . }}-manager-rolebinding
  labels:
    {{- include "dc-controller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "dc-controller.fullname" . }}-manager-role
subjects:
- kind: ServiceAccount
  name: {{ include "dc-controller.fullname" . }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "dc-controller.fullname" . }}-leader-election-role
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dc-controller.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: [configmaps]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: [coordination.k8s.io]
  resources: [leases]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: [""]
  resources: [events]
  verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "dc-controller.fullname" . }}-leader-election-rolebinding
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dc-controller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "dc-controller.fullname" . }}-leader-election-role
subjects:
- kind: ServiceAccount
  name: {{ include "dc-controller.fullname" . }}
  namespace: {{ .Release.Namespace }}
