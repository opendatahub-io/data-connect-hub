controllerManager:
  image:
    repository: quay.io/opendatahub/odh-data-connect-hub-controller
    tag: odh-3.6
    pullPolicy: Always
  replicas: 1
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 10m
      memory: 64Mi

relatedImages:
  restService: quay.io/opendatahub/odh-data-connect-hub-rest:odh-3.6
  flightService: quay.io/opendatahub/odh-data-connect-hub-flight:odh-3.6
  kubeRbacProxy: quay.io/opendatahub/odh-kube-rbac-proxy:odh-3.6

leaderElection: true

serviceCA:
  # Enable this for OpenShift installs. Non-OpenShift installs can rely on
  # the system trust store or provide their own CA through the environment.
  enabled: false
  configMapName: openshift-service-ca.crt
  mountPath: /var/run/secrets/openshift-service-ca
