apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../default

patches:
- path: manager_metrics_patch.yaml
  target:
    kind: Deployment
    name: manager
- path: metrics_service_patch.yaml
  target:
    kind: Service
    name: metrics-service
- path: metrics_network_policy_patch.yaml
  target:
    kind: NetworkPolicy
    name: allow-metrics-traffic
