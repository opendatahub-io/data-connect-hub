# This patch mounts the OpenShift service-ca-provisioned metrics certificate.
- op: add
  path: /spec/template/spec/containers/0/volumeMounts/-
  value:
    mountPath: /tmp/k8s-metrics-server/metrics-certs
    name: metrics-certs
    readOnly: true

- op: add
  path: /spec/template/spec/containers/0/args/-
  value: --metrics-cert-path=/tmp/k8s-metrics-server/metrics-certs

- op: add
  path: /spec/template/spec/volumes/-
  value:
    name: metrics-certs
    secret:
      secretName: dc-controller-metrics-tls
      optional: false
      items:
      # OpenShift serving-cert Secrets contain only the TLS key pair. The
      # service CA is injected into the separate service-ca ConfigMap volume.
      - key: tls.crt
        path: tls.crt
      - key: tls.key
        path: tls.key
