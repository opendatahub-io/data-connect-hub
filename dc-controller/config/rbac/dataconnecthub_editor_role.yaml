# This rule is not used by the project dc-controller itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the dataconnecthub.opendatahub.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: dc-controller
    app.kubernetes.io/managed-by: kustomize
  name: dataconnecthub-editor-role
rules:
- apiGroups:
  - dataconnecthub.opendatahub.io
  resources:
  - dataconnectservices
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - dataconnecthub.opendatahub.io
  resources:
  - dataconnectservices/status
  verbs:
  - get
