# This rule is not used by the project dc-controller itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full CRUD permissions over dataconnecthub.opendatahub.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: dc-controller
    app.kubernetes.io/managed-by: kustomize
  name: dataconnecthub-admin-role
rules:
- apiGroups:
  - dataconnecthub.opendatahub.io
  resources:
  - dataconnectservices
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - dataconnecthub.opendatahub.io
  resources:
  - dataconnectservices/status
  verbs:
  - get
