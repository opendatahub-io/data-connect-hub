# Minimal stand-in for the platform Auth CRD owned by the opendatahub-operator,
# used only by envtest.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: auths.services.platform.opendatahub.io
spec:
  group: services.platform.opendatahub.io
  names:
    kind: Auth
    listKind: AuthList
    plural: auths
    singular: auth
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                adminGroups:
                  type: array
                  items:
                    type: string
                allowedGroups:
                  type: array
                  items:
                    type: string
