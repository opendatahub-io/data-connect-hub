# cargo-deny configuration. `make audit` runs `cargo deny check` alongside
# `cargo audit`; keep the [advisories] ignore list in step with
# .cargo/audit.toml. Advisories that fire only in cargo audit's Cargo.lock
# scan (unactivated optional dependencies) have no entry here: cargo-deny
# resolves the graph cargo actually builds and would flag their ignore as
# advisory-not-detected.
#
# unused-ignored-advisory = "deny" enforces staleness: any invocation of
# `cargo deny check` fails once an ignore entry no longer matches
# an encountered advisory, and the entry must be removed (here and in
# .cargo/audit.toml).

[advisories]
unmaintained = "all"
unused-ignored-advisory = "deny"
maximum-db-staleness = "P30D"
ignore = [
    # h2 unbounded empty DATA frames — transitive dep via actix-http,
    # actix-http has not released a version using h2 0.4 yet.
    # Also ignored in .cargo/audit.toml.
    { id = "RUSTSEC-2026-0258", reason = "h2 0.3.x pinned by actix-http; no actix-http release uses h2 0.4 yet" },
    # cookie 0.16.2 private-cookie nonce reuse across fork(). Fixed in cookie
    # 0.18.3, but actix-web (latest 4.20.0) requires cookie ^0.16; its
    # upgrade PR actix/actix-web#3336 is open. Not exploitable here:
    # actix-web does not fork worker processes and nothing in the workspace
    # seals private cookies.
    # Also ignored in .cargo/audit.toml.
    { id = "RUSTSEC-2026-0594", reason = "actix-web pins cookie ^0.16; the fix requires actix-web to adopt cookie 0.18 (actix/actix-web#3336 open), and fork-based private-cookie use does not occur here" },
    # Unmaintained transitive dependencies; not under our control.
    # backoff 0.4.0 (via neo4rs)
    { id = "RUSTSEC-2025-0012", reason = "neo4rs requires backoff; no neo4rs release drops it" },
    # instant 0.1.13 (via backoff)
    { id = "RUSTSEC-2024-0384", reason = "pulled in by backoff via neo4rs" },
    # paste 1.0.15 (via neo4rs)
    { id = "RUSTSEC-2024-0436", reason = "neo4rs requires paste; no neo4rs release drops it" },
    # rustls-pemfile 2.2.0 (via neo4rs, rustls-native-certs)
    { id = "RUSTSEC-2025-0134", reason = "neo4rs and rustls-native-certs require rustls-pemfile" },
    # chrono 0.4.45 (via arrow-arith; Arrow is our interchange format)
    # Also ignored in .cargo/audit.toml.
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained; arrow requires it and no fixed release exists" },
    # chrono-tz 0.8.6 and its build dep chrono-tz-build 0.2.1 (via neo4rs)
    # Also ignored in .cargo/audit.toml.
    { id = "RUSTSEC-2026-0555", reason = "chrono-tz is unmaintained; neo4rs requires it and no fixed release exists" },
    { id = "RUSTSEC-2026-0559", reason = "chrono-tz-build is unmaintained; build dep of chrono-tz via neo4rs" },
    # libsqlite3-sys 0.30.1 bundles SQLite < 3.54.0 (CVE-2026-119375,
    # WAL page-size mismatch leaks uninitialized page-cache memory).
    # The fix needs libsqlite3-sys 0.39.0+, but sqlx-sqlite caps it
    # <0.38 and no sqlx release allows 0.39 yet; the upper-bound bump
    # (sqlx#4502) is merged but unreleased.
    # Also ignored in .cargo/audit.toml.
    { id = "RUSTSEC-2026-0459", reason = "sqlx-sqlite caps libsqlite3-sys <0.38; no sqlx release allows the fixed 0.39 yet" },
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Fork of latchset/kryoptic supplying ossl and rustls-ossl with the FIPS fixes
# listed in the [patch.crates-io] section of the workspace Cargo.toml. Remove
# along with that section once the fixes are released upstream.
allow-git = ["https://github.com/loicmarchal/kryoptic-dch"]
