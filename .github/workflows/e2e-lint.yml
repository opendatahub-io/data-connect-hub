name: E2E Lint

on:
  push:
    branches: [main]
    paths:
      - 'e2e/**'
  pull_request:
    paths:
      - 'e2e/**'

concurrency:
  group: e2e-lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lint
        run: make e2e-lint
