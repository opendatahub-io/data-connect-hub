name: Auto-update image digests

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch: {}

concurrency:
  group: digest-update
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  update-digests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: imjasonh/setup-crane@v0.4

      - name: Update digests and open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          BRANCH="chore/auto-digest-update"
          LABEL="digest-update"
          CANONICAL="dc-controller/config/default/params.env"

          IMAGES=(
            "controller|quay.io/opendatahub/odh-data-connect-hub-controller|odh-stable|RELATED_IMAGE_ODH_DATA_CONNECT_HUB_CONTROLLER_IMAGE"
            "rest|quay.io/opendatahub/odh-data-connect-hub-rest|odh-stable|RELATED_IMAGE_ODH_DATA_CONNECT_HUB_REST_IMAGE"
            "flight|quay.io/opendatahub/odh-data-connect-hub-flight|odh-stable|RELATED_IMAGE_ODH_DATA_CONNECT_HUB_FLIGHT_IMAGE"
            "kube-rbac-proxy|quay.io/opendatahub/odh-kube-rbac-proxy|odh-stable|RELATED_IMAGE_ODH_KUBE_RBAC_PROXY_IMAGE"
          )

          FILES=(
            config/base/params.env
            dc-controller/config/default/params.env
            dc-controller/chart/values.yaml
            dc-controller/cmd/main.go
            dc-controller/config/manager/kustomization.yaml
            config/overlays/dev/kustomization.yaml
            dc-controller/internal/controller/dataconnectservice_controller_test.go
          )

          declare -a changed=()

          for entry in "${IMAGES[@]}"; do
            IFS='|' read -r name repo tag env_var <<< "$entry"

            cur_line=$(grep "^${env_var}=" "$CANONICAL" || true)
            if [[ -z "$cur_line" ]]; then
              echo "SKIP  ${name}: ${env_var} not found in ${CANONICAL}"
              continue
            fi
            cur_hex=$(echo "$cur_line" | sed -n 's/.*sha256:\([a-f0-9]\{64\}\).*/\1/p')
            if [[ -z "$cur_hex" ]]; then
              echo "SKIP  ${name}: could not parse current digest"
              continue
            fi

            echo "RESOLVE  ${repo}:${tag}"
            if ! new_full=$(crane digest "${repo}:${tag}" 2>&1); then
              echo "  WARN  crane failed: ${new_full}"
              continue
            fi
            new_hex=${new_full#sha256:}

            echo "  current: ${cur_hex:0:12}..."
            echo "  latest:  ${new_hex:0:12}..."

            if [[ "$cur_hex" == "$new_hex" ]]; then
              echo "  -> up to date"
              continue
            fi

            echo "  -> CHANGED"
            changed+=("$name")

            for f in "${FILES[@]}"; do
              if grep -q "$cur_hex" "$f" 2>/dev/null; then
                sed -i "s/${cur_hex}/${new_hex}/g" "$f"
                echo "  updated ${f}"
              fi
            done
          done

          if [[ ${#changed[@]} -eq 0 ]]; then
            echo "All digests up to date."
            exit 0
          fi

          list=$(printf ', %s' "${changed[@]}")
          list=${list:2}
          msg="chore: update image digests (${list})"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A
          git commit -s -m "$msg"
          git push --force origin "$BRANCH"

          gh label create "$LABEL" \
            --description "Automated image-digest updates" \
            --color "1d76db" 2>/dev/null || true

          existing_pr=$(gh pr list --label "$LABEL" --state open \
            --json number --jq '.[0].number // empty')

          if [[ -n "$existing_pr" ]]; then
            echo "Force-pushed to existing PR #${existing_pr}"
          else
            gh pr create \
              --title "$msg" \
              --body "$(cat <<'BODY'
          ## Summary

          Automated image-digest update. The `:odh-stable` tags were resolved
          to their current `@sha256:` digests across all pinned references.

          Generated by the `auto-digest-update` workflow.
          BODY
          )" \
              --label "$LABEL" \
              --base main \
              --head "$BRANCH"
          fi
