name: Check Signed Commits

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: signed-commits-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  signed-commits:
    name: Check commit signatures
    if: github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify commit signatures via GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          failed=0
          page=1

          while true; do
            commits=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/commits?per_page=100&page=${page}" \
              --jq '.[] | "\(.sha)\t\(.parents | length)\t\(.commit.verification.verified)"')

            if [ -z "$commits" ]; then
              break
            fi

            while IFS=$'\t' read -r sha parent_count verified; do
              # Skip merge commits
              if [ "$parent_count" -gt 1 ]; then
                continue
              fi
              if [ "$verified" != "true" ]; then
                echo "WARNING: Commit ${sha:0:7} is not signed."
                failed=1
              fi
            done <<< "$commits"

            page=$((page + 1))
          done

          if [ "$failed" -eq 1 ]; then
            echo ""
            echo "One or more commits are not signed."
            echo "See: https://docs.github.com/en/authentication/managing-commit-signature-verification/signing-commits"
            exit 1
          fi

          echo "All commits are signed."
