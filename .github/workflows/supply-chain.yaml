name: Supply Chain

# ------------------------------------------------------------------------------
# Workflow Settings
# ------------------------------------------------------------------------------

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

env:
  # Bumping either version changes its cache key, so the cached binary is
  # rebuilt instead of the install step being skipped.
  CARGO_AUDIT_VERSION: "0.22.2"
  CARGO_DENY_VERSION: "0.20.2"

jobs:
  # ----------------------------------------------------------------------------
  # Security Audit
  # ----------------------------------------------------------------------------

  security-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.96.0"

      - name: Cache cargo binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin
          key: ${{ runner.os }}-cargo-bin-audit-${{ env.CARGO_AUDIT_VERSION }}

      - name: Install cargo-audit
        run: command -v cargo-audit || cargo install cargo-audit --version "$CARGO_AUDIT_VERSION" --locked

      - name: Run cargo audit
        run: cargo audit

  # ----------------------------------------------------------------------------
  # License & Dependency Check
  # ----------------------------------------------------------------------------

  dependency-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.96.0"

      - name: Cache cargo binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin
          key: ${{ runner.os }}-cargo-bin-deny-${{ env.CARGO_DENY_VERSION }}

      - name: Install cargo-deny
        run: command -v cargo-deny || cargo install cargo-deny --version "$CARGO_DENY_VERSION" --locked

      - name: Run cargo deny
        run: cargo deny check
