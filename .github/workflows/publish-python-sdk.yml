name: Release Python SDK

on:
  push:
    tags: ["sdk-v*"]

permissions: {}

concurrency:
  group: publish-python-sdk-pypi
  cancel-in-progress: false

jobs:
  # Build and publish are separate jobs so the job executing repository code
  # never has the OIDC permission used for trusted publishing.
  build:
    name: Build SDK distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # setuptools-scm derives the version from tags, so the full history
          # and all tags must be present.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c # v5.0.0
        with:
          python-version: "3.11"

      - name: Build and validate distribution
        run: |
          python -m venv .sdk-release-venv
          source .sdk-release-venv/bin/activate
          python -m pip install --upgrade build twine packaging
          make sdk-package-check

      - name: Verify release version
        run: |
          # setuptools-scm derives the version from the tag, so a mismatch means
          # the tag is not a clean PEP 440 release tag (extra commits, wrong prefix).
          version="$(.sdk-release-venv/bin/python -c 'from packaging.version import Version; import sys; print(Version(sys.argv[1]))' "${GITHUB_REF_NAME#sdk-v}")"
          wheel="sdk/python/dist/data_connect_hub-${version}-py3-none-any.whl"
          test -f "$wheel" || {
            echo "Release tag $GITHUB_REF_NAME did not produce $wheel"
            echo "Built artifacts:"
            ls -1 sdk/python/dist
            exit 1
          }

      - name: Upload distribution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-sdk-dist
          path: sdk/python/dist/
          if-no-files-found: error

  publish:
    name: Publish SDK to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/data-connect-hub
    permissions:
      # This job only consumes the built artifact, so it never checks out or
      # executes repository code while able to mint a trusted-publishing token.
      id-token: write

    steps:
      - name: Download distribution
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-sdk-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
        with:
          packages-dir: dist/
          # Do not skip existing versions. A duplicate upload means the tag was
          # already published and must fail visibly.

  release:
    name: Create GitHub Release
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out source history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download distribution
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-sdk-dist
          path: dist/

      - name: Generate SDK release notes
        run: |
          previous_tag="$(git describe --tags --match='sdk-v*' --abbrev=0 "$GITHUB_SHA^" 2>/dev/null || true)"
          {
            echo "## Python SDK changes"
            echo
            if [ -n "$previous_tag" ]; then
              git log --format='- %s (%h)' "$previous_tag..$GITHUB_SHA" -- \
                sdk/python \
                .github/workflows/python-sdk.yml \
                .github/workflows/publish-python-sdk.yml \
                .github/workflows/publish-python-sdk-testpypi.yml
            else
              git log --format='- %s (%h)' "$GITHUB_SHA" -- \
                sdk/python \
                .github/workflows/python-sdk.yml \
                .github/workflows/publish-python-sdk.yml \
                .github/workflows/publish-python-sdk-testpypi.yml
            fi
          } > release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --notes-file release-notes.md
