name: Publish Python SDK to TestPyPI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-python-sdk-testpypi
  cancel-in-progress: false

jobs:
  # Build and publish are separate jobs so that the job executing build
  # dependencies never holds the OIDC permission used for trusted publishing.
  build:
    name: Build SDK distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # setuptools-scm derives the version from tags and commit distance, so
          # the full history and all tags must be present.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c # v5.0.0
        with:
          python-version: "3.11"

      - name: Install packaging tools
        run: python -m pip install --upgrade build twine

      - name: Build and validate distribution
        run: make sdk-package-check VIRTUAL_ENV=1

      - name: Upload distribution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-sdk-dist
          path: sdk/python/dist/
          if-no-files-found: error

  publish:
    name: Upload SDK to TestPyPI
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/data-connect-hub
    permissions:
      # No contents: read. This job only consumes the built artifact, so it
      # never checks out or executes repository code while able to mint an
      # OIDC token for the trusted publisher.
      id-token: write

    steps:
      - name: Download distribution
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-sdk-dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          # skip-existing is deliberately left off: a duplicate upload means the
          # commit was already published, and that should fail visibly rather
          # than report a green run in which nothing was uploaded.
