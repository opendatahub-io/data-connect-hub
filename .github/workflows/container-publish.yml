name: Container Publish

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: container-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  docker:
    if: github.repository == 'opendatahub-io/data-connect-hub'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        env:
          GH_SHA: ${{ github.sha }}
          GH_REF_TYPE: ${{ github.ref_type }}
          GH_REF_NAME: ${{ github.ref_name }}
        run: |
          COMMIT_SHA="${GH_SHA:0:7}"
          echo "commit_sha=${COMMIT_SHA}" >> $GITHUB_OUTPUT

          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "build_date=${BUILD_DATE}" >> $GITHUB_OUTPUT

          if [[ "${GH_REF_TYPE}" == "tag" ]]; then
            VERSION="${GH_REF_NAME}"
            TAG="${GH_REF_NAME}"
          elif [[ "${GH_REF_NAME}" == "main" ]]; then
            VERSION="main-${COMMIT_SHA}"
            TAG="latest"
          else
            VERSION="dev-${COMMIT_SHA}"
            TAG="dev"
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Build and push dc-controller
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dc-controller/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/dc-controller:${{ steps.meta.outputs.commit_sha }}
            ${{ env.REGISTRY }}/${{ github.repository }}/dc-controller:${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.created=${{ steps.meta.outputs.build_date }}
            org.opencontainers.image.title=dc-controller
            org.opencontainers.image.description=Data Connect Hub - Kubernetes Controller
          cache-from: type=gha,scope=dc-controller
          cache-to: type=gha,mode=max,scope=dc-controller

      - name: Build and push flight-service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/flight/Containerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/flight-service:${{ steps.meta.outputs.commit_sha }}
            ${{ env.REGISTRY }}/${{ github.repository }}/flight-service:${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.created=${{ steps.meta.outputs.build_date }}
            org.opencontainers.image.title=flight-service
            org.opencontainers.image.description=Data Connect Hub - Flight Service (gRPC/Arrow Flight)
          cache-from: type=gha,scope=flight
          cache-to: type=gha,mode=max,scope=flight

      - name: Build and push rest-service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/rest/Containerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/rest-service:${{ steps.meta.outputs.commit_sha }}
            ${{ env.REGISTRY }}/${{ github.repository }}/rest-service:${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.created=${{ steps.meta.outputs.build_date }}
            org.opencontainers.image.title=rest-service
            org.opencontainers.image.description=Data Connect Hub - REST Service (HTTP/actix-web)
          cache-from: type=gha,scope=rest
          cache-to: type=gha,mode=max,scope=rest

      - name: Output image tags
        env:
          REGISTRY_REPO: ${{ env.REGISTRY }}/${{ github.repository }}
          COMMIT_SHA: ${{ steps.meta.outputs.commit_sha }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          echo "Images pushed:"
          echo "  - ${REGISTRY_REPO}/dc-controller:${COMMIT_SHA}"
          echo "  - ${REGISTRY_REPO}/dc-controller:${TAG}"
          echo "  - ${REGISTRY_REPO}/flight-service:${COMMIT_SHA}"
          echo "  - ${REGISTRY_REPO}/flight-service:${TAG}"
          echo "  - ${REGISTRY_REPO}/rest-service:${COMMIT_SHA}"
          echo "  - ${REGISTRY_REPO}/rest-service:${TAG}"
