name: E2E Tests

on:
  pull_request:
    paths:
      - 'services/**'
      - 'libs/**'
      - 'connectors/**'
      - 'dc-controller/**'
      - 'config/**'
      - 'e2e/**'
      - 'hack/**'
      - 'sdk/python/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

concurrency:
  group: e2e-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e-test:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c # v5.0.0
        with:
          python-version: '3.11'

      - name: Install kind
        run: |
          curl -Lo ./kind "https://kind.sigs.k8s.io/dl/latest/kind-linux-amd64"
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      - name: Install Helm
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm version

      - name: Setup kind cluster
        run: bash hack/ci/setup-kind.sh

      - name: Deploy DCH
        run: bash hack/ci/deploy-dch.sh

      - name: Run E2E tests
        run: bash hack/ci/run-tests.sh

      - name: Test disabled connector behavior
        env:
          CI_DISABLED_CONNECTORS: uri
        run: bash hack/ci/run-disabled-connector-test.sh

      - name: Collect cluster logs
        if: always()
        run: |
          source hack/ci/lib.sh
          dump_cluster "$CI_SVC_NAMESPACE" "$CI_TENANT_NAMESPACE"
