arches:
  - x86_64
  - aarch64
  - ppc64le
  - s390x
contentOrigin:
  repos:
    - repoid: ubi-9-for-$basearch-baseos-rpms
      baseurl: https://cdn-ubi.redhat.com/content/public/ubi/dist/ubi9/9/$basearch/baseos/os
      gpgcheck: 1
      gpgkey: file:///etc/pki/rpm-gpg/RPM-GPG-KEY-redhat-release
    - repoid: ubi-9-for-$basearch-appstream-rpms
      baseurl: https://cdn-ubi.redhat.com/content/public/ubi/dist/ubi9/9/$basearch/appstream/os
      gpgcheck: 1
      gpgkey: file:///etc/pki/rpm-gpg/RPM-GPG-KEY-redhat-release
    - repoid: ubi-9-for-$basearch-codeready-builder-rpms
      baseurl: https://cdn-ubi.redhat.com/content/public/ubi/dist/ubi9/9/$basearch/codeready-builder/os
      gpgcheck: 1
      gpgkey: file:///etc/pki/rpm-gpg/RPM-GPG-KEY-redhat-release
packages:
  - cargo
  - gcc
  - gcc-c++
  - make
  - perl
  - pkgconf
context:
  containerfile:
    file: services/flight/Containerfile.konflux
    stageName: builder
