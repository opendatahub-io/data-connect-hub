openapi: 3.0.3
info:
  title: Data Connect Hub REST API
  description: REST API for managing data connections and connection types.
  version: 0.1.0
  license:
    name: Apache-2.0

servers:
  - url: /api/v1alpha1/data

security:
  - tenantHeader: []

paths:
  /health:
    servers:
      - url: /
    get:
      operationId: health
      summary: Health check
      security: []
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "components/schemas/HealthResponse.yaml"

  /connections:
    get:
      operationId: listConnections
      summary: List connections
      tags: [connections]
      responses:
        "200":
          description: Connection list
          content:
            application/json:
              schema:
                $ref: "components/schemas/DataConnectionResourceList.yaml"
        "400":
          $ref: "components/responses/BadRequest.yaml"
        "503":
          $ref: "components/responses/ServiceUnavailable.yaml"
    post:
      operationId: createConnection
      summary: Create a connection
      tags: [connections]
      description: >
        Accepts two payload variants (untagged union):
        use `credentials_ref` to reference an existing secret,
        or `credentials` to supply inline credentials (the server
        creates the secret automatically).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "components/schemas/DataConnection.yaml"
                - $ref: "components/schemas/DataConnectionWithCreds.yaml"
      responses:
        "201":
          description: Connection created
          content:
            application/json:
              schema:
                $ref: "components/schemas/DataConnectionResource.yaml"
        "400":
          $ref: "components/responses/BadRequest.yaml"
        "422":
          $ref: "components/responses/UnprocessableEntity.yaml"
        "503":
          $ref: "components/responses/ServiceUnavailable.yaml"

  /connections/{id}:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    get:
      operationId: getConnection
      summary: Get a connection
      tags: [connections]
      responses:
        "200":
          description: Connection details
          content:
            application/json:
              schema:
                $ref: "components/schemas/DataConnectionResource.yaml"
        "400":
          $ref: "components/responses/BadRequest.yaml"
        "404":
          $ref: "components/responses/NotFound.yaml"
    patch:
      operationId: patchConnection
      summary: Update a connection
      description: >
        Partially updates a connection using JSON Merge Patch (RFC 7396).
        Supply only the fields you want to change; omitted fields are left unchanged.
      tags: [connections]
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "components/schemas/DataConnectionMergePatch.yaml"
      responses:
        "200":
          description: Connection updated
          content:
            application/json:
              schema:
                $ref: "components/schemas/DataConnectionResource.yaml"
        "400":
          $ref: "components/responses/BadRequest.yaml"
        "404":
          $ref: "components/responses/NotFound.yaml"
        "422":
          $ref: "components/responses/UnprocessableEntity.yaml"
    delete:
      operationId: deleteConnection
      summary: Delete a connection
      tags: [connections]
      responses:
        "204":
          description: Connection deleted
        "400":
          $ref: "components/responses/BadRequest.yaml"
        "404":
          $ref: "components/responses/NotFound.yaml"

  /connections/{id}/exports/secrets/{secret_name}:
    parameters:
      - $ref: "#/components/parameters/resourceId"
      - name: secret_name
        in: path
        required: true
        schema:
          type: string
        description: Name of the Kubernetes secret to create or overwrite
    put:
      operationId: exportConnection
      summary: Export a connection to a Kubernetes secret
      description: >
        Flattens the connection metadata, properties, and credentials into
        a single Kubernetes secret with dot-notation keys
        (e.g. `data_connection.name`, `data_connection.properties.host`).
        If the secret already exists it is overwritten.
      tags: [connections]
      responses:
        "204":
          description: Secret created or updated
        "400":
          $ref: "components/responses/BadRequest.yaml"
        "404":
          $ref: "components/responses/NotFound.yaml"

  /connections/{id}/readiness:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    post:
      operationId: checkConnectionReadiness
      summary: Check connection readiness
      description: >
        Validates that the connection's credentials secret exists,
        matches the connection type schema, and that the data source
        is reachable. Updates the connection status accordingly.
      tags: [connections]
      responses:
        "204":
          description: Connection is ready
        "400":
          $ref: "components/responses/BadRequest.yaml"
        "404":
          $ref: "components/responses/NotFound.yaml"
        "422":
          $ref: "components/responses/UnprocessableEntity.yaml"

  /connections/{id}/binary:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    get:
      operationId: downloadBinary
      summary: Download binary data from a connection
      description: >
        Streams binary data (files, objects) from a data connection.
        The file path is connector-specific: for S3 it is an object key
        within the configured bucket, for URI connectors it is a relative
        URL path joined to the base URI.
        Only connectors that support binary reads (currently S3 and URI)
        will return data; all others respond with 501.
      tags: [connections]
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
          description: File path or object key to download
          example: models/model.bin
      responses:
        "200":
          description: Binary data stream
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          headers:
            Content-Disposition:
              schema:
                type: string
              description: Suggests a filename for the download
              example: 'attachment; filename="model.bin"'
        "400":
          $ref: "components/responses/BadRequest.yaml"
        "401":
          $ref: "components/responses/Unauthorized.yaml"
        "403":
          $ref: "components/responses/Forbidden.yaml"
        "404":
          $ref: "components/responses/NotFound.yaml"
        "501":
          $ref: "components/responses/NotImplemented.yaml"
        "503":
          $ref: "components/responses/ServiceUnavailable.yaml"

  /test/credentials:
    post:
      operationId: testCredentials
      summary: Test credentials against a data source
      description: >
        Tests the provided credentials by attempting to connect to
        the data source without creating any resources.
      tags: [test]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "components/schemas/TestCredentials.yaml"
      responses:
        "204":
          description: Credentials are valid
        "400":
          $ref: "components/responses/BadRequest.yaml"
        "422":
          $ref: "components/responses/UnprocessableEntity.yaml"

  /connection-types:
    get:
      operationId: listConnectionTypes
      summary: List connection types
      tags: [connection-types]
      responses:
        "200":
          description: Connection type list
          content:
            application/json:
              schema:
                $ref: "components/schemas/DataConnectionTypeResourceList.yaml"
        "400":
          $ref: "components/responses/BadRequest.yaml"
        "503":
          $ref: "components/responses/ServiceUnavailable.yaml"
    post:
      operationId: createConnectionType
      summary: Create a connection type
      tags: [connection-types]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "components/schemas/DataConnectionType.yaml"
      responses:
        "201":
          description: Connection type created
          content:
            application/json:
              schema:
                $ref: "components/schemas/DataConnectionTypeResource.yaml"
        "400":
          $ref: "components/responses/BadRequest.yaml"
        "503":
          $ref: "components/responses/ServiceUnavailable.yaml"

  /connection-types/{id}:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    get:
      operationId: getConnectionType
      summary: Get a connection type
      tags: [connection-types]
      responses:
        "200":
          description: Connection type details
          content:
            application/json:
              schema:
                $ref: "components/schemas/DataConnectionTypeResource.yaml"
        "400":
          $ref: "components/responses/BadRequest.yaml"
        "404":
          $ref: "components/responses/NotFound.yaml"
    patch:
      operationId: patchConnectionType
      summary: Update a connection type
      description: >
        Partially updates a connection type using JSON Merge Patch (RFC 7396).
        Supply only the fields you want to change; omitted fields are left unchanged.
      tags: [connection-types]
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "components/schemas/DataConnectionTypeMergePatch.yaml"
      responses:
        "200":
          description: Connection type updated
          content:
            application/json:
              schema:
                $ref: "components/schemas/DataConnectionTypeResource.yaml"
        "400":
          $ref: "components/responses/BadRequest.yaml"
        "404":
          $ref: "components/responses/NotFound.yaml"
    delete:
      operationId: deleteConnectionType
      summary: Delete a connection type
      tags: [connection-types]
      responses:
        "204":
          description: Connection type deleted
        "400":
          $ref: "components/responses/BadRequest.yaml"
        "404":
          $ref: "components/responses/NotFound.yaml"

  /audit/data-connection-types:
    servers:
      - url: /api/v1alpha1
    post:
      operationId: auditConnectionTypes
      summary: Audit all connection types
      description: >
        Queries the Flight service for supported connectors and updates
        the status of all connection types accordingly.
        This endpoint does not require the x-tenant-id header.
      x-internal: true
      tags: [connection-types]
      security: []
      responses:
        "202":
          description: Audit started
        "503":
          $ref: "components/responses/ServiceUnavailable.yaml"

components:
  securitySchemes:
    tenantHeader:
      type: apiKey
      in: header
      name: x-tenant-id
      description: Tenant identifier. Required on all endpoints except /health.

  parameters:
    resourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Resource unique identifier

tags:
  - name: connections
    description: Data connection management
  - name: connection-types
    description: Connection type definitions
  - name: test
    description: Test operations
