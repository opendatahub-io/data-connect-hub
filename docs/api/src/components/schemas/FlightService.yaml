type: object
required: [name, namespace, external_url, internal_url, status]
properties:
  name:
    type: string
    description: Name of the Flight service
    example: flight-service
  namespace:
    type: string
    description: Kubernetes namespace where the Flight service runs
    example: dch-services
  external_url:
    type: string
    description: Externally reachable URL of the Flight service
    example: "grpcs://flight.apps.example.com:443"
  internal_url:
    type: string
    description: Cluster-internal URL of the Flight service
    example: "grpcs://flight-service.dch-services.svc:50051"
  supported_connectors:
    type: array
    items:
      type: string
    description: Provider names of connectors this Flight service supports (populated during registration)
    example: [postgres, s3]
  connector_capabilities:
    type: object
    additionalProperties:
      type: array
      items:
        type: string
        enum: [tabular, binary]
    description: >-
      Maps each connector provider name to its supported data formats.
      Populated during registration from the Flight service's connector
      metadata.
    example:
      postgres: [tabular]
      s3: [tabular, binary]
  status:
    $ref: "FlightServiceStatus.yaml"
