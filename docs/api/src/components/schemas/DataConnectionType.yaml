type: object
required: [name, provider, credentials_fields]
properties:
  name:
    type: string
    description: The name of the connection type. This name is unique for connection types of this tenant.
    example: PostgreSQL
  provider:
    type: string
    example: postgres
  description:
    type: string
    nullable: true
  credentials_fields:
    type: array
    items:
      $ref: "Field.yaml"
  tags:
    type: array
    nullable: true
    description: >
      Arbitrary labels for categorising the connection type
      (e.g. "domain: database", "engine: postgresql").
    items:
      type: string
      minLength: 1
    example:
      - "domain: database"
      - "engine: postgresql"
      - "access: sql"
