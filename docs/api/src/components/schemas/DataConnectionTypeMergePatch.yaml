type: object
description: >
  RFC 7396 JSON Merge Patch for a DataConnectionType. Supply only
  the fields you want to change.
properties:
  name:
    type: string
  label:
    type: string
    nullable: true
  provider:
    type: string
  description:
    type: string
    nullable: true
  credentials_fields:
    type: array
    items:
      $ref: "Field.yaml"
  tags:
    type: array
    nullable: true
    description: Arbitrary labels for categorising the connection type.
    items:
      type: string
      minLength: 1
