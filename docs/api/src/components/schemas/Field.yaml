type: object
required: [name, label, required, type]
properties:
  name:
    type: string
    example: URI
  label:
    type: string
    example: Connection URI
  description:
    type: string
    nullable: true
    example: PostgreSQL connection URI
  required:
    type: boolean
  type:
    type: string
    example: string
  enum_values:
    type: array
    nullable: true
    description: >
      Allowed values; only meaningful when ``type`` is ``enum``.
    items:
      $ref: "EnumValue.yaml"
  default_value:
    type: string
    nullable: true
