type: object
required: [flight_ready]
properties:
  flight_ready:
    type: boolean
    description: Whether a Flight gRPC service supports this connection type
  flight_url:
    type: string
    nullable: true
    description: URL of the Flight service that supports this connection type
  message:
    type: string
    nullable: true
    description: Optional human-readable status message
  updated_at:
    type: string
    nullable: true
    description: Timestamp of the last status update
