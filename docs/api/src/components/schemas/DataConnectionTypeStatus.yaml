type: object
required: [supported_formats, flight_ready]
properties:
  supported_formats:
    type: array
    items:
      type: string
      enum: [tabular, binary]
    description: >-
      Data formats this connection type supports, determined by the
      registered Flight connector.  Independent of flight_ready — the
      list stays stable even when the Flight pod is down.  An empty
      list means the type is credentials-only, with no built-in
      ingestion.
    example: [tabular]
  flight_ready:
    type: boolean
    description: Whether a Flight gRPC service supports this connection type and is currently running
  flight_url:
    type: string
    nullable: true
    description: URL of the Flight service that supports this connection type
  message:
    type: string
    nullable: true
    description: Optional human-readable status message
  updated_at:
    type: string
    nullable: true
    description: Timestamp of the last status update
