type: object
description: >
  Live connection health, updated by readiness checks and credential validation.
required: [state]
properties:
  state:
    $ref: "DataConnectionState.yaml"
  message:
    type: string
    nullable: true
    description: Optional human-readable status message
  updated_at:
    type: string
    nullable: true
    description: Timestamp of the last status update
