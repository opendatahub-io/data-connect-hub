[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "data-connect-hub"
dynamic = ["version"]
description = "Python SDK for the Data Connect Hub service"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.0,<3",
]

[project.optional-dependencies]
flight = [
    "adbc-driver-flightsql>=1.0.0",
    "pyarrow>=14.0",
    "pandas>=2.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/opendatahub-io/data-connect-hub"
Repository = "https://github.com/opendatahub-io/data-connect-hub"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
data_connect_hub = ["py.typed"]

[tool.setuptools.dynamic]
version = {attr = "data_connect_hub._version.__version__"}

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "pyarrow",
    "pyarrow.*",
    "pandas",
    "adbc_driver_flightsql.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["data_connect_hub"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
