[build-system]
requires = ["setuptools>=77.0", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-connect-hub"
dynamic = ["version"]
description = "Python SDK for the Data Connect Hub service"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["data", "data-connect-hub", "data-connectivity", "flight-sql", "opendatahub"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.0,<3",
]

[project.optional-dependencies]
flight = [
    "adbc-driver-flightsql>=1.0.0",
    "pyarrow>=14.0",
    "pandas>=2.0",
    "protobuf>=6.33.5",
]
dev = [
    "build>=1.2",
    "numpy<2.5", # NumPy 2.5 stubs require Python 3.12 syntax; the SDK type-checks against Python 3.11.
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "twine>=5.0",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/opendatahub-io/data-connect-hub"
Repository = "https://github.com/opendatahub-io/data-connect-hub"
Documentation = "https://opendatahub-io.github.io/data-connect-hub/"
Issues = "https://github.com/opendatahub-io/data-connect-hub/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
data_connect_hub = ["py.typed"]

[tool.setuptools_scm]
root = "../.."
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"
tag_regex = "^v(?P<version>.*)$"
# No fallback_version on purpose. setuptools-scm also uses it as the
# guess-next-dev base when the repo has no tags yet, so setting it would move
# untagged builds below the 0.1.devN series already on TestPyPI. A tree with no
# .git must fail loudly rather than publish a version that sorts wrong.

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "pyarrow",
    "pyarrow.*",
    "pandas",
    "adbc_driver_flightsql.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["data_connect_hub"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
