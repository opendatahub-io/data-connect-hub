apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml

# Run ./generate-secrets.sh once before the first apply to create these
# git-ignored files locally; kustomize builds the real Secret from them.
secretGenerator:
  - name: postgres-credentials
    envs:
      - postgres-credentials.env
    files:
      - secret-config.toml

generatorOptions:
  # Kept stable (no content-hash suffix) on purpose: rest-service and
  # flight-service reference this Secret by the static name
  # "postgres-credentials" from *separate* Kustomize trees (config/base/*),
  # applied independently. Kustomize can only auto-rewrite a generated
  # resource's name in consumers that live in the SAME kustomization build —
  # it has no visibility into those other trees, so enabling the hash suffix
  # here would silently break their secretName/secretKeyRef references
  # instead of fixing rotation.
  #
  # Consequence: rotating this secret (see generate-secrets.sh) does NOT
  # automatically roll rest-service/flight-service pods onto the new
  # credentials — you must manually `oc rollout restart` both after
  # re-applying, per the runbook in docs/user-guide/deploy.md. Fixing this
  # properly would mean merging all three into one kustomization (tracked as
  # a follow-up), not just flipping this flag.
  disableNameSuffixHash: true
