apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: data-connect-hub
  labels:
    app.kubernetes.io/part-of: data-connect-hub
spec:
  parentRefs:
    - name: odh-gateway
      namespace: opendatahub
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1/data
      backendRefs:
        - name: rest-service
          port: 8080
