name: ElasticSearch
provider: elasticsearch
description: Elasticsearch search and analytics engine
credentials_fields:
  - name: URI
    label: URI
    description: Elasticsearch server URI
    required: true
    type: string
  - name: USERNAME
    label: Username
    description: Elasticsearch username
    required: false
    type: string
  - name: PASSWORD
    label: Password
    description: Elasticsearch password
    required: false
    type: string
  - name: CA_CERT
    label: CA Certificate
    description: CA certificate for TLS verification
    required: false
    type: string
  - name: API_KEY
    label: API Key
    description: Elasticsearch API key (alternative to username/password)
    required: false
    type: string
