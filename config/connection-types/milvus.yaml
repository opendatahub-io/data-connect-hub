name: Milvus
provider: milvus
description: Milvus vector database
credentials_fields:
  - name: MILVUS_URI
    label: URI
    description: Milvus server URI
    required: true
    type: string
  - name: MILVUS_TOKEN
    label: Token
    description: Milvus authentication token
    required: false
    type: string
  - name: MILVUS_DATABASE
    label: Database
    description: Milvus database name
    required: false
    type: string
    default_value: default
  - name: MILVUS_CA_CERT
    label: CA Certificate
    description: CA certificate for TLS verification
    required: false
    type: string
