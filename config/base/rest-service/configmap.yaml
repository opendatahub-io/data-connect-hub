apiVersion: v1
kind: ConfigMap
metadata:
  name: rest-service-config
  labels:
    app.kubernetes.io/name: rest-service
    app.kubernetes.io/part-of: data-connect-hub
data:
  config.toml: |
    [server]
    address = "0.0.0.0"
    port = 8080
    sa-token-file = "/var/run/secrets/kubernetes.io/serviceaccount/token"

    [global-connection-types]
    tenant-id = "opendatahub"

    [metrics]
    enabled = true
    address = "0.0.0.0"
    port = 9090

    [flight-service]
    address = "flight-service"
    ca-cert = "/etc/tls/flight/ca.crt"
