apiVersion: v1
kind: ConfigMap
metadata:
  name: rest-service-config
  labels:
    app.kubernetes.io/name: rest-service
    app.kubernetes.io/part-of: data-connect-hub
data:
  config.toml: |
    [server]
    address = "0.0.0.0"
    port = 8080

    [global-connection-types]
    tenant-id = "opendatahub"

    [flight-service]
    address = "flight-service"
    port = 8443
