apiVersion: v1
kind: ConfigMap
metadata:
  name: rest-service-kube-rbac-proxy-config
  labels:
    app.kubernetes.io/name: rest-service
    app.kubernetes.io/part-of: data-connect-hub
data:
  config-file.yaml: |
    authorization:
      endpoints:
        - path: /api/v1/data/connections/*
          mappings:
            - methods: [get, post, patch, delete]
              resources:
                - rewrites:
                    byHttpHeader:
                      name: X-Tenant-Id
                  resourceAttributes:
                    namespace: "{{.FromHeader}}"
                    apiGroup: dataconnecthub.opendatahub.io
                    resource: data-connections
                    verb: "{{.FromMethod}}"
        - path: /api/v1/data/connections
          mappings:
            - methods: [get, post]
              resources:
                - rewrites:
                    byHttpHeader:
                      name: X-Tenant-Id
                  resourceAttributes:
                    namespace: "{{.FromHeader}}"
                    apiGroup: dataconnecthub.opendatahub.io
                    resource: data-connections
                    verb: "{{.FromMethod}}"
        - path: /api/v1/data/connection-types/*
          mappings:
            - methods: [get, post, patch, delete]
              resources:
                - rewrites:
                    byHttpHeader:
                      name: X-Tenant-Id
                  resourceAttributes:
                    namespace: "{{.FromHeader}}"
                    apiGroup: dataconnecthub.opendatahub.io
                    resource: data-connection-types
                    verb: "{{.FromMethod}}"
        - path: /api/v1/data/connection-types
          mappings:
            - methods: [get, post]
              resources:
                - rewrites:
                    byHttpHeader:
                      name: X-Tenant-Id
                  resourceAttributes:
                    namespace: "{{.FromHeader}}"
                    apiGroup: dataconnecthub.opendatahub.io
                    resource: data-connection-types
                    verb: "{{.FromMethod}}"
        # Internal endpoint invoked only by dc-controller to refresh DCT
        # capability flags. Cluster-scoped (no tenant namespace) so access is
        # gated purely by the caller's ServiceAccount identity, via the
        # data-connection-types-audit-invoker ClusterRole/ClusterRoleBinding.
        - path: /api-internal/v1/audit/data-connection-types
          mappings:
            - methods: [post]
              resources:
                - resourceAttributes:
                    apiGroup: dataconnecthub.opendatahub.io
                    resource: data-connection-types
                    subresource: audit
                    verb: create
