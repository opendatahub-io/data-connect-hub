apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rest-service-data-access
rules:
  - apiGroups: ["dataconnecthub.opendatahub.io"]
    resources: ["data-connections", "data-connection-types", "data-store"]
    verbs: ["get", "list", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rest-service-data-access
subjects:
  - kind: ServiceAccount
    name: rest-service-sa
    namespace: opendatahub
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rest-service-data-access
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rest-service-secret-access
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: secret-export
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
