# REST calls Flight with its own ServiceAccount token, and Flight authorizes
# every call against `get` on `data-store` in the tenant namespace. Callers are
# already authorized by kube-rbac-proxy before their requests reach REST.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rest-service-data-access
rules:
  - apiGroups: ["dataconnecthub.opendatahub.io"]
    resources: ["data-store"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rest-service-data-access
subjects:
  - kind: ServiceAccount
    name: rest-service-sa
    namespace: opendatahub
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rest-service-data-access
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rest-service-secret-access
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch", "delete"]
