apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rest-service
  labels:
    app.kubernetes.io/name: rest-service
    app.kubernetes.io/part-of: data-connect-hub
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rest-service
  policyTypes:
    - Ingress
    - Egress
  # Ingress is otherwise allow-all for now: we don't yet have a defined
  # gateway/client topology to scope sources down to. The port restriction
  # below is not optional though — it ensures all traffic passes through the
  # kube-rbac-proxy sidecar on 8443; the unauthenticated app port 8080 must
  # never be reachable from another pod.
  ingress:
    - ports:
        - protocol: TCP
          port: 8443
  egress:
    - {}
