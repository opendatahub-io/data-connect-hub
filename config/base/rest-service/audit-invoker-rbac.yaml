apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: data-connection-types-audit-invoker
rules:
  - apiGroups: ["dataconnecthub.opendatahub.io"]
    resources: ["data-connection-types/audit"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: data-connection-types-audit-invoker
subjects:
  # dc-controller is deployed via its own Helm chart (dc-controller/charts),
  # not this kustomize tree, so its ServiceAccount name/namespace is
  # hardcoded here rather than generated. This namespace follows the
  # controller default. For standalone installs in a different namespace,
  # patch this subject namespace.
  - kind: ServiceAccount
    name: dc-controller-manager
    namespace: opendatahub
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: data-connection-types-audit-invoker
