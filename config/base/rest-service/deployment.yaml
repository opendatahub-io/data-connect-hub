apiVersion: apps/v1
kind: Deployment
metadata:
  name: rest-service
  labels:
    app.kubernetes.io/name: rest-service
    app.kubernetes.io/part-of: data-connect-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rest-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rest-service
        app.kubernetes.io/part-of: data-connect-hub
    spec:
      serviceAccountName: data-connect-hub-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rest-service
          image: RELATED_IMAGE_ODH_DATA_CONNECT_HUB_REST_IMAGE
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          args:
            - --config
            - /config/config.toml
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: RUST_LOG
              value: info
          volumeMounts:
            - name: config
              mountPath: /config
            - name: db-secret
              mountPath: /secrets
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/v1/data/health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/data/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
      volumes:
        - name: config
          configMap:
            name: rest-service-config
        - name: db-secret
          secret:
            secretName: postgres-credentials
            items:
              - key: secret-config.toml
                path: secret-config.toml
