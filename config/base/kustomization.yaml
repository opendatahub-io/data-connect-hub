apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namePrefix: dch-
resources:
  - rest-service
  - flight-service
  - gateway

configurations:
  - name-reference.yaml

configMapGenerator:
- name: params
  envs:
  - params.env
  options:
    disableNameSuffixHash: true

replacements:
- source:
    kind: ConfigMap
    name: params
    fieldPath: data.RELATED_IMAGE_ODH_DATA_CONNECT_HUB_REST_IMAGE
  targets:
  - select:
      kind: Deployment
      name: rest-service
    fieldPaths:
    - spec.template.spec.containers.[name=rest-server].image
- source:
    kind: ConfigMap
    name: params
    fieldPath: data.RELATED_IMAGE_ODH_DATA_CONNECT_HUB_FLIGHT_IMAGE
  targets:
  - select:
      kind: Deployment
      name: flight-service
    fieldPaths:
    - spec.template.spec.containers.[name=flight-server].image
- source:
    kind: ConfigMap
    name: params
    fieldPath: data.RELATED_IMAGE_ODH_KUBE_RBAC_PROXY_IMAGE
  targets:
  - select:
      kind: Deployment
      name: rest-service
    fieldPaths:
    - spec.template.spec.containers.[name=kube-rbac-proxy].image
- source:
    kind: ServiceAccount
    name: flight-service-sa
    fieldPath: metadata.name
  targets:
  - select:
      kind: ClusterRoleBinding
      name: flight-auth-delegator
    fieldPaths:
    - subjects.[name=flight-service-sa].name
- source:
    kind: ServiceAccount
    name: rest-service-sa
    fieldPath: metadata.name
  targets:
  - select:
      kind: ClusterRoleBinding
      name: kube-rbac-proxy-auth-review
    fieldPaths:
    - subjects.[name=rest-service-sa].name
- source:
    kind: ConfigMap
    name: params
    fieldPath: data.GATEWAY_NAMESPACE
  targets:
  - select:
      kind: NetworkPolicy
      name: rest-service
    fieldPaths:
    - spec.ingress.0.from.0.namespaceSelector.matchLabels.[kubernetes.io/metadata.name]
  - select:
      kind: NetworkPolicy
      name: flight-service
    fieldPaths:
    - spec.ingress.1.from.0.namespaceSelector.matchLabels.[kubernetes.io/metadata.name]
