apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: flight-service
  labels:
    app.kubernetes.io/name: flight-service
    app.kubernetes.io/part-of: data-connect-hub
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: flight-service
  policyTypes:
    - Ingress
    - Egress
  # Allow-all for now: we don't yet have a defined gateway/client topology to
  # scope this down to. This exists so the policy can be tightened later
  # without having to introduce the resource from scratch.
  ingress:
    - {}
  egress:
    - {}
