apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: flight-service
  labels:
    app.kubernetes.io/name: flight-service
    app.kubernetes.io/part-of: data-connect-hub
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: flight-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: opendatahub
          podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: odh-gateway
      ports:
        - port: 8443
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: rest-service
      ports:
        - port: 8443
          protocol: TCP
  egress:
    - {}
