apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: flight-service
  labels:
    app.kubernetes.io/name: flight-service
    app.kubernetes.io/part-of: data-connect-hub
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: flight-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
          podSelector:
            matchLabels:
              app.kubernetes.io/name: rest-service
      ports:
        - protocol: TCP
          port: 8443
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: opendatahub
          podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: odh-gateway
      ports:
        - protocol: TCP
          port: 8443
    - ports:
        - protocol: TCP
          port: 9090
