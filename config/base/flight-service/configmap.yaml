apiVersion: v1
kind: ConfigMap
metadata:
  name: flight-service-config
  labels:
    app.kubernetes.io/name: flight-service
    app.kubernetes.io/part-of: data-connect-hub
data:
  config.toml: |
    [server]
    address = "0.0.0.0"
    port = 8443

    [ingestion_cache_pools]
    max_capacity = 50
    ttl_secs = 30
    idle_secs = 30

    [tls]
    cert_file = "/etc/tls/private/tls.crt"
    key_file = "/etc/tls/private/tls.key"

    [auth]
    enabled = true
    cache_ttl_secs = 60

    [metrics]
    enabled = true
    address = "0.0.0.0"
    port = 9090

    [connectors.default]
    connection_timeout_secs = 10

    # Per-connector overrides (optional, inherits from [connectors.default]):
    # [connectors.postgres]
    # connection_timeout_secs = 30
    #
    # [connectors.sqlite]
    # connection_timeout_secs = 10
    #
    # [connectors.elasticsearch]
    # connection_timeout_secs = 10
    #
    # [connectors.neo4j]
    # connection_timeout_secs = 10
    #
    # [connectors.milvus]
    # connection_timeout_secs = 10
    #
    # [connectors.s3]
    # connection_timeout_secs = 10

    [global-connection-types]
    tenant-id = "opendatahub"
