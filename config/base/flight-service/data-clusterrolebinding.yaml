# Grants Flight service account permission to call TokenReview and
# SubjectAccessReview APIs through the built-in `system:auth-delegator` role.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flight-auth-delegator
subjects:
  # This namespace follows the controller default.
  # For standalone installs in a different namespace, patch this subject namespace.
  - kind: ServiceAccount
    name: flight-service-sa
    namespace: opendatahub
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
