apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dch-admins
subjects:
  # Bind your IdP group/user that should have cross-tenant access.
  # Defaulting to a dedicated group keeps regular users namespaced.
  - kind: Group
    name: dch-admins
    apiGroup: rbac.authorization.k8s.io
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dch-admin
