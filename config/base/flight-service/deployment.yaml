apiVersion: apps/v1
kind: Deployment
metadata:
  name: flight-service
  labels:
    app.kubernetes.io/name: flight-service
    app.kubernetes.io/part-of: data-connect-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: flight-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flight-service
        app.kubernetes.io/part-of: data-connect-hub
    spec:
      serviceAccountName: flight-service-sa
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: flight-service
          image: RELATED_IMAGE_ODH_DATA_CONNECT_HUB_FLIGHT_IMAGE
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          args:
            - --config
            - /config/config.toml
          ports:
            - name: grpc
              containerPort: 8443
            - name: metrics
              containerPort: 9090
          env:
            - name: RUST_LOG
              value: info
          volumeMounts:
            - name: config
              mountPath: /config
            - name: db-secret
              mountPath: /secrets
              readOnly: true
            - name: tls
              mountPath: /etc/tls/private
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 5
            periodSeconds: 15
      volumes:
        - name: config
          configMap:
            name: flight-service-config
        - name: db-secret
          secret:
            secretName: dch-database-config
            items:
              - key: secret-config.toml
                path: secret-config.toml
        - name: tls
          secret:
            secretName: flight-service-tls
