# Predefined ClusterRoles for granting users access to the DCH data plane APIs
# (REST via kube-rbac-proxy, Flight via in-service SubjectAccessReview).
# Bind them per tenant with a RoleBinding in the tenant namespace.
# See docs/user-guide/auth.md for the operation-to-role mapping.
#
# Only verbs that an endpoint actually checks are granted: kube-rbac-proxy maps
# GET/POST/PATCH/DELETE to get/create/patch/delete (no route uses PUT on these
# resources), list endpoints are checked as `get`, and Flight only checks `get`
# on `data-store`.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: read
rules:
  - apiGroups: ["dataconnecthub.opendatahub.io"]
    resources: ["data-connections", "data-connection-types", "data-store"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: read-write
rules:
  - apiGroups: ["dataconnecthub.opendatahub.io"]
    resources: ["data-connections", "data-connection-types"]
    verbs: ["get", "create", "patch", "delete"]
  - apiGroups: ["dataconnecthub.opendatahub.io"]
    resources: ["data-store"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: admin
rules:
  - apiGroups: ["dataconnecthub.opendatahub.io"]
    resources: ["data-connections", "data-connection-types"]
    verbs: ["get", "create", "patch", "delete"]
  - apiGroups: ["dataconnecthub.opendatahub.io"]
    resources: ["data-store"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: secret-export
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
